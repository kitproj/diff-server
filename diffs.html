<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Git Diffs</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css"
            integrity="sha512-0aPQyyeZrWj9sCA46UlmWgKOP0mUipLQ6OZXu8l4IcAmD2u31EPEy9VcIMvl7SoAaKe8bLXZhYoMaE/in+gcgA=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/diff2html@3.4.56/bundles/css/diff2html.min.css"
            integrity="sha384-PdRCG/+r1waybtXfuDB9Kmv2h7AGoN6WaTZ5OF+ctPeR9BGne0FaKRQnUeGV4nDL"
            crossorigin="anonymous"
        />
        <style>
            :root {
                --bg: #f6f8fa;
                --surface: #fff;
                --border: #d0d7de;
                --text: #1f2328;
                --muted: #656d76;
                --danger: #cf222e;
                --radius: 8px;
                --space: 1rem;
                --space-sm: 0.75rem;
                --max-width: 1200px;
                --font: system-ui, sans-serif;
                --mono: ui-monospace, monospace;
                --font-size: 14px;
                --font-size-sm: 0.875rem;
                --font-size-code: 12px;
            }

            /* app chrome */
            body {
                margin: 0 auto;
                max-width: var(--max-width);
                padding: 1.5rem;
                background: var(--bg);
                color: var(--text);
                font: var(--font-size) / 1.5 var(--font);
            }

            h1 {
                margin: 0 0 var(--space);
                font-size: 1.25rem;
                font-weight: 600;
            }

            #message {
                margin-bottom: var(--space);
                color: var(--muted);
            }

            #message.error {
                color: var(--danger);
            }

            #diffs {
                display: flex;
                flex-direction: column;
                gap: var(--space);
            }

            /* card */
            .repo {
                overflow: hidden;
                border: 1px solid var(--border);
                border-radius: var(--radius);
                background: var(--surface);
            }

            .repo h2 {
                margin: 0;
                padding: var(--space-sm) var(--space);
                border-bottom: 1px solid var(--border);
                background: var(--bg);
                font-size: var(--font-size-sm);
                font-weight: 600;
                word-break: break-all;
            }

            /* diff2html overrides */
            .repo .d2h-wrapper {
                margin: 0;
            }

            .repo .d2h-file-wrapper {
                border: 0;
                border-radius: 0;
                margin: 0;
            }

            .repo .d2h-file-header {
                border-top: 1px solid var(--border);
            }

            .repo .d2h-file-wrapper:first-child .d2h-file-header {
                border-top: 0;
            }

            .repo .d2h-code-line-ctn {
                font-family: var(--mono);
                font-size: var(--font-size-code);
                word-break: break-word;
            }
        </style>
    </head>
    <body>
        <h1>Git Diffs</h1>
        <div id="message">Loading diffs...</div>
        <div id="diffs"></div>

        <script
            src="https://cdn.jsdelivr.net/npm/diff2html@3.4.56/bundles/js/diff2html-ui.min.js"
            integrity="sha384-NRd5i/CwvZ20mJEQt3yaDU1LeU+tu0bqyVYojXi8d7Lf1B0/TIs2K3FTvlf8aO7p"
            crossorigin="anonymous"
        ></script>
        <script>
            const message = document.getElementById("message");
            const diffs = document.getElementById("diffs");

            async function fetchAndRender() {
                message.className = "";
                message.textContent = "Loading diffs...";

                try {
                    const reposResponse = await fetch("/repos");
                    if (!reposResponse.ok) {
                        throw new Error("Failed to list repositories");
                    }

                    const repos = await reposResponse.json();
                    diffs.innerHTML = "";

                    if (repos.length === 0) {
                        message.textContent = "No git repositories found.";
                        return;
                    }

                    let completed = 0;
                    let changedRepos = 0;

                    await Promise.all(
                        repos.map(async (repo) => {
                            const response = await fetch(
                                "/diff?repo=" + encodeURIComponent(repo),
                                { headers: { Accept: "text/x-diff" } },
                            );
                            if (!response.ok) {
                                throw new Error(
                                    "Failed to load diff for " + repo,
                                );
                            }

                            const data = await response.text();
                            completed++;
                            message.textContent =
                                "Loading diffs... (" +
                                completed +
                                "/" +
                                repos.length +
                                ")";

                            if (!data.trim()) {
                                return;
                            }

                            changedRepos++;

                            const section = document.createElement("section");
                            section.className = "repo";

                            const title = document.createElement("h2");
                            title.textContent = repo;
                            section.appendChild(title);

                            const container = document.createElement("div");
                            section.appendChild(container);
                            diffs.appendChild(section);

                            new Diff2HtmlUI(container, data).draw();
                        }),
                    );

                    if (changedRepos === 0) {
                        message.textContent = "No uncommitted changes.";
                        return;
                    }

                    message.textContent = "";
                } catch (error) {
                    message.className = "error";
                    message.textContent =
                        "Error fetching diffs: " + error.message;
                }
            }

            fetchAndRender();
            setInterval(fetchAndRender, 10000);
        </script>
    </body>
</html>
